<!DOCTYPE html>
<html lang="en">
<head>
  <title>Order Confirmation | Sweet's Bed and Rolls</title>
  <meta charset="utf-8">
  <link href="styles/styles.css" rel="stylesheet">
  <script defer>
    function loadOrder() {
      const data = JSON.parse(localStorage.getItem("orderData"));

      if (!data) {
        document.getElementById("orderSummary").innerHTML =
          "<p>No order found.</p>";
        return;
      }

      let output = "<h3>Items Ordered</h3>";
      output += "<table border='1'><tr><th>Item</th><th>Options</th><th>Qty</th><th>Total</th></tr>";

      let total = 0;

      data.cart.forEach(item => {
        let itemTotal = item.price * item.quantity;
        total += itemTotal;

        output += `
          <tr>
            <td>${item.product}</td>
            <td>${item.size || ""} ${item.color || ""}</td>
            <td>${item.quantity}</td>
            <td>$${itemTotal}</td>
          </tr>
        `;
      });

      output += "</table>";
      output += `<p><strong>Order Total: $${total}</strong></p>`;

      output += "<h3>Billing Info</h3>";
      output += `<p>${data.billing.name}<br>
                 ${data.billing.email}<br>
                 ${data.billing.phone}</p>`;

      output += "<h3>Shipping Info</h3>";
      output += `<p>${data.shipping.shipName}<br>
                 ${data.shipping.shipEmail}<br>
                 ${data.shipping.shipPhone}</p>`;

      document.getElementById("orderSummary").innerHTML = output;

      // optional: clear cart after showing
      localStorage.removeItem("cart");
    }

    window.onload = loadOrder;
  </script>
</head>
